[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-restoration"
version = "0.2.0"
description = "Band-sequence modeling for high-quality audio restoration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-SA-4.0" }
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy>=1.23",
    "soundfile>=0.12",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
train = [
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "rich>=13.0",
    "lightning-utilities>=0.9",
    "h5py>=3.8",
    "librosa>=0.10",
    "lameenc>=1.5",
    "tensorboard>=2.13",
    "tqdm>=4.65",
]
test = ["pytest>=7.0"]

[project.scripts]
apollo-restore = "inference:main"

[tool.setuptools.packages.find]
include = ["look2hear*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
